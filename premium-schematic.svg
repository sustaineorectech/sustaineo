<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="feed-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e30" />
      <stop offset="100%" stop-color="#1a251d" />
    </linearGradient>
    
    <linearGradient id="des-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7b58" />
      <stop offset="100%" stop-color="#1c4731" />
    </linearGradient>

    <linearGradient id="zld-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ab4dc" />
      <stop offset="100%" stop-color="#067c9c" />
    </linearGradient>

    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d562" />
      <stop offset="100%" stop-color="#b88d18" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-soft" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>

    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3D7B58" opacity="0.6" />
    </marker>
    <marker id="arrow-zld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0AB4DC" opacity="0.8" />
    </marker>
  </defs>

  <style>
    .font-head { font-family: 'Termina', sans-serif; font-weight: 700; fill: #ffffff; font-size: 14px; letter-spacing: 0.05em; }
    .font-sub { font-family: 'acumin-pro', sans-serif; font-weight: 400; fill: rgba(255,255,255,0.7); font-size: 11px; }
    .font-dark { fill: #1C2820; }
    .font-dark-sub { fill: rgba(28,40,32,0.6); }

    .node-base { rx: 12; filter: url(#shadow-soft); transition: all 0.3s ease; }
    .node-base:hover { transform: translateY(-3px); }
    
    .path-main { stroke: #3D7B58; stroke-width: 3; fill: none; opacity: 0.4; stroke-linecap: round; }
    .path-zld { stroke: #0AB4DC; stroke-width: 3; fill: none; opacity: 0.6; stroke-linecap: round; stroke-dasharray: 6,6; animation: dashMove 10s linear infinite; }
    
    @keyframes dashMove { to { stroke-dashoffset: -100; } }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.8; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.2); }
    }
    
    .glow-anim { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- BACKGROUND GRID -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3D7B58" opacity="0.1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ==================== PATHS ==================== -->
  
  <!-- Feed to Shredding -->
  <path d="M 180 250 L 250 250" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Shredding to DES Reactor -->
  <path d="M 410 250 L 460 250" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Reactor to Separation -->
  <path d="M 620 250 L 670 250" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Separation to Metal Recovery (Top Path) -->
  <path d="M 750 210 C 750 150, 780 150, 830 150" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Separation to Solids Output (Straight) -->
  <path d="M 830 250 L 880 250" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Separation to Solvent Regen (Bottom Path) -->
  <path d="M 750 290 C 750 380, 780 380, 830 380" class="path-main" marker-end="url(#arrow)" />
  
  <!-- Solvent Regen ZLD Loop back to Reactor -->
  <path d="M 830 420 C 750 420, 540 450, 540 290" class="path-zld" marker-end="url(#arrow-zld)" />

  <!-- ==================== NODES ==================== -->

  <!-- 1. Feedstock -->
  <g transform="translate(40, 210)">
    <rect width="140" height="80" class="node-base" fill="url(#feed-grad)" />
    <text x="70" y="35" text-anchor="middle" class="font-head">Feedstock</text>
    <text x="70" y="55" text-anchor="middle" class="font-sub">E-Waste / Solar</text>
  </g>

  <!-- 2. Shredding -->
  <g transform="translate(250, 210)">
    <rect width="160" height="80" class="node-base" fill="#ffffff" stroke="#e0e5e2" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" class="font-head font-dark">Classification</text>
    <text x="80" y="55" text-anchor="middle" class="font-sub font-dark-sub">Mechanical Shredding</text>
  </g>

  <!-- 3. DES Reactor -->
  <g transform="translate(460, 190)">
    <rect width="160" height="120" class="node-base glow-anim" fill="url(#des-grad)" filter="url(#glow-emerald)" />
    <circle cx="80" cy="35" r="16" fill="#06D6A0" opacity="0.2" />
    <path d="M 70 35 L 75 40 L 90 25" fill="none" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" />
    <text x="80" y="70" text-anchor="middle" class="font-head">DES Leaching</text>
    <text x="80" y="90" text-anchor="middle" class="font-sub">Green Solvometallurgy</text>
  </g>

  <!-- 4. Separation -->
  <g transform="translate(670, 210)">
    <rect width="160" height="80" class="node-base" fill="#ffffff" stroke="#e0e5e2" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" class="font-head font-dark">S/L Separation</text>
    <text x="80" y="55" text-anchor="middle" class="font-sub font-dark-sub">Filtration</text>
  </g>

  <!-- 5. Metal Recovery (Top) -->
  <g transform="translate(830, 110)">
    <rect width="140" height="80" class="node-base" fill="url(#metal-grad)" />
    <text x="70" y="35" text-anchor="middle" class="font-head">Critical Metals</text>
    <text x="70" y="55" text-anchor="middle" class="font-sub font-dark">&gt;99.9% Purity</text>
  </g>

  <!-- 6. Non-Metallics (Middle) -->
  <g transform="translate(880, 210)">
    <rect width="100" height="80" class="node-base" fill="#f4f7f5" stroke="#d0d6d3" stroke-width="2" stroke-dasharray="4" />
    <text x="50" y="35" text-anchor="middle" class="font-head font-dark">Polymers</text>
    <text x="50" y="55" text-anchor="middle" class="font-sub font-dark-sub">Glass / Resins</text>
  </g>

  <!-- 7. Solvent Regeneration ZLD (Bottom) -->
  <g transform="translate(830, 340)">
    <rect width="140" height="80" class="node-base glow-anim" fill="url(#zld-grad)" filter="url(#glow-cyan)" />
    <text x="70" y="35" text-anchor="middle" class="font-head">ZLD Loop</text>
    <text x="70" y="55" text-anchor="middle" class="font-sub">Solvent Regeneration</text>
  </g>

</svg>
